[package]
name = "aether-wasm"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Multithreaded engine: rayon over Web Workers sharing linear memory. Needs
# the atomics/bulk-memory target features and a nightly `-Zbuild-std`; see
# scripts/build-wasm.sh --threads.
parallel = ["aether-core/parallel", "dep:wasm-bindgen-rayon"]

[dependencies]
aether-core = { path = "../aether-core" }
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen-rayon = { version = "1.3", optional = true }

# wasm-opt must be told the module may use these proposals; enabling them for
# the single-threaded build is harmless because that module never emits them.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-simd", "--enable-threads", "--enable-bulk-memory", "--enable-mutable-globals"]
