name: Deploy (Cloudflare Pages)

# Deploys only a main commit that passed CI. `workflow_run` names CI by its
# `name:`, so renaming that workflow silently stops deploys; rename both.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: false

env:
  PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'aether' }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    # A push to main whose CI succeeded. `branches` alone would also admit a
    # pull request whose head branch happens to be called main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    permissions:
      contents: read
      deployments: write
      issues: write
    steps:
      # The commit CI tested, not whatever main points at by the time this runs.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Must match rust-toolchain.toml (see ci.yml).
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      - run: bash scripts/build-wasm.sh release
      - run: bash scripts/build-wasm.sh release --threads
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Performance gate: holds the deploy when the median per-frame engine
      # step of the baseline build exceeds 50 ms (BENCH_LIMIT_MS).
      - name: Benchmark WASM engine step
        id: bench
        continue-on-error: true
        run: node scripts/benchmark-wasm.mjs wasm-benchmark.json
      - name: Report benchmark
        if: always()
        run: |
          {
            echo "## WASM engine step benchmark"
            echo
            echo '| frames | median ms | p95 ms | max ms | mean ms | limit ms | result |'
            echo '|---|---|---|---|---|---|---|'
            jq -r '"| \(.frames) | \(.medianMs) | \(.p95Ms) | \(.maxMs) | \(.meanMs) | \(.limitMs) | \(if .passed then "pass" else "**FAIL: deploy held**" end) |"' wasm-benchmark.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-benchmark
          path: wasm-benchmark.json
      - name: Alert engineering team
        if: steps.bench.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create urgent --color B60205 --description "Needs immediate attention" 2>/dev/null || true
          gh label create performance --color FBCA04 2>/dev/null || true
          gh issue create --label urgent --label performance \
            --title "URGENT: deploy held, WASM engine step over 50 ms (${SHA:0:7})" \
            --body "$(printf 'The deploy of `%s` was held because the WASM performance benchmark failed.\n\n```json\n%s\n```\n\nRun: %s' "$SHA" "$(cat wasm-benchmark.json 2>/dev/null || echo 'benchmark did not produce metrics')" "$RUN_URL")"
          exit 1
      # `npm ci` vendors the MediaPipe runtime (postinstall); the models are
      # self-hosted too so the app does not depend on Google's CDN.
      - run: npm ci
        working-directory: web
      # Same key as ci.yml's e2e job. This runs on main, so the entry it saves
      # is the one pull requests restore, including after a CI run on main that
      # skipped its jobs. No restore-keys: fetch-models keeps any model file
      # already present, so an older cache would be used silently.
      - uses: actions/cache@v4
        with:
          path: web/public/models
          key: mediapipe-models-${{ hashFiles('scripts/fetch-models.mjs') }}
      - run: npm run fetch:models
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          # Absolute URL for the link-preview tags: the custom domain attached
          # to the Pages project. Set repo variable SITE_URL to override.
          VITE_SITE_URL: ${{ vars.SITE_URL || 'https://aether-physics.xyz' }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Creates the Pages project on the first run; fails harmlessly afterwards.
          preCommands: npx wrangler pages project create ${{ env.PAGES_PROJECT }} --production-branch=main || true
          command: pages deploy web/dist --project-name=${{ env.PAGES_PROJECT }} --branch=main
