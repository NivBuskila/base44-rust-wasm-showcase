name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# `actions: read` lets the first job look up the record the last job leaves.
permissions:
  contents: read
  actions: read

jobs:
  # A merged pull request usually lands on main as the exact tree its own run
  # already passed, and running the same 20 minutes again on that tree only
  # delays the deploy. Every run that passes records the tree it tested (for a
  # pull request that is GitHub's merge of it into main); a push whose tree
  # carries such a record skips the jobs below, the run still succeeds, and the
  # deploy starts at once. Anything else is tested in full: a direct push, and
  # a pull request whose tested merge is not what landed because main moved.
  # Only this repository's own runs count, never a fork's.
  tested:
    name: Tree already tested
    runs-on: ubuntu-latest
    outputs:
      tree: ${{ steps.check.outputs.tree }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          skip=false
          # A failed lookup only costs the full run, never a skip.
          if [ "$EVENT" = push ]; then
            runs=$(gh api "repos/$REPO/actions/artifacts?name=ci-passed-$tree" --jq '
              [.artifacts[]
                | select(.expired | not)
                | select(.workflow_run.head_repository_id == .workflow_run.repository_id)
                | .workflow_run.id] | unique | map(tostring) | join(" ")') || runs=""
            if [ -n "$runs" ]; then
              skip=true
              echo "Tree $tree already passed CI in run(s) $runs; skipping the jobs." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  rust:
    name: Rust (fmt, clippy, test)
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Must match rust-toolchain.toml: cargo honours that pin, so installing a
      # different stable leaves the pinned toolchain without rustfmt/clippy.
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The browser runs the threaded engine, and banding bugs only show with
      # more than one thread: `fluid/tests/threads.rs` exists only here.
      - run: cargo clippy -p aether-core --all-targets --features parallel -- -D warnings
      - run: cargo test -p aether-core --features parallel

  web:
    name: Web (wasm build, typecheck, unit tests)
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      # Both builds run: the typecheck follows `engine-loader.ts` into
      # web/src/wasm-mt as well, so the threaded module's .d.ts has to exist
      # (the script installs the pinned nightly + rust-src on demand).
      - run: bash scripts/build-wasm.sh release
      - run: bash scripts/build-wasm.sh release --threads
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run test:unit
        working-directory: web
      # The e2e job runs the same engines; handing them over saves it a second
      # Rust toolchain and nightly build.
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-engines
          path: |
            web/src/wasm
            web/src/wasm-mt
          retention-days: 1

  e2e:
    name: Browser (Playwright, headless)
    needs: [tested, web]
    if: needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # 17-18 minutes of SwiftShader when healthy (the phone suite boots the app
    # five times at 3x DPR); runners vary ~1.7x, and the cap catches a hang.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasm-engines
          path: web/src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # `npm ci` also vendors the MediaPipe runtime into public/mp-wasm.
      - run: npm ci
        working-directory: web
      # The perception suite loads the real models. Cached, so a run does not
      # depend on Google's CDN once they are in.
      - uses: actions/cache@v4
        with:
          path: web/public/models
          key: mediapipe-models-${{ hashFiles('scripts/fetch-models.mjs') }}
      - run: npm run fetch:models
        working-directory: web
      # Full Chromium only (`channel: 'chromium'` in playwright.config.ts).
      - run: npx playwright install --with-deps --no-shell chromium
        working-directory: web
      # The suite runs against `vite preview` of the production build.
      - run: npx vite build
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/test-results
          retention-days: 7

  # Runs only when every job above passed, so the record means the whole run.
  passed:
    name: Record the tested tree
    needs: [tested, rust, web, e2e]
    if: needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ needs.tested.outputs.tree }}" > tested-tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ci-passed-${{ needs.tested.outputs.tree }}
          path: tested-tree.txt
          retention-days: 30
          # A re-run of a failed job must be able to record the pass.
          overwrite: true
