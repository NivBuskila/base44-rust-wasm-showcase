name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Must match rust-toolchain.toml: cargo honours that pin, so installing a
      # different stable leaves the pinned toolchain without rustfmt/clippy.
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The browser runs the threaded engine, and banding bugs only show with
      # more than one thread: `fluid/tests/threads.rs` exists only here.
      - run: cargo clippy -p aether-core --all-targets --features parallel -- -D warnings
      - run: cargo test -p aether-core --features parallel

  web:
    name: Web (wasm build, typecheck, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      # Both builds run: the typecheck follows `engine-loader.ts` into
      # web/src/wasm-mt as well, so the threaded module's .d.ts has to exist
      # (the script installs the pinned nightly + rust-src on demand).
      - run: bash scripts/build-wasm.sh release
      - run: bash scripts/build-wasm.sh release --threads
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run test:unit
        working-directory: web
      # The e2e job runs the same engines; handing them over saves it a second
      # Rust toolchain and nightly build.
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-engines
          path: |
            web/src/wasm
            web/src/wasm-mt
          retention-days: 1

  e2e:
    name: Browser (Playwright, headless)
    needs: web
    runs-on: ubuntu-latest
    # ~12 minutes of SwiftShader when healthy; the cap catches a hang.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasm-engines
          path: web/src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # `npm ci` also vendors the MediaPipe runtime into public/mp-wasm.
      - run: npm ci
        working-directory: web
      # The perception suite loads the real models. Cached, so a run does not
      # depend on Google's CDN once they are in.
      - uses: actions/cache@v4
        with:
          path: web/public/models
          key: mediapipe-models-${{ hashFiles('scripts/fetch-models.mjs') }}
      - run: npm run fetch:models
        working-directory: web
      # Full Chromium only (`channel: 'chromium'` in playwright.config.ts).
      - run: npx playwright install --with-deps --no-shell chromium
        working-directory: web
      # The suite runs against `vite preview` of the production build.
      - run: npx vite build
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/test-results
          retention-days: 7
