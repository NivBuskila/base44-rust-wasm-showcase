<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <!-- Inline so the browser's automatic /favicon.ico request never 404s. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2300d0ff'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23040510'/%3E%3Ccircle cx='23' cy='9' r='2.5' fill='%23ff5ea8'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Aether - a gesture-driven fluid reality engine. Rust and WebAssembly physics, real-time hand and body tracking, in your browser."
    />
    <title>Aether — gesture-driven fluid</title>
    <!-- Link previews (WhatsApp, X, LinkedIn…). Crawlers need absolute URLs:
         VITE_SITE_URL comes from web/.env, overridden by the deploy workflow. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aether" />
    <meta property="og:title" content="Aether — move smoke with your hands" />
    <meta
      property="og:description"
      content="A gesture-driven fluid engine: Rust and WebAssembly physics with real-time hand tracking, running entirely in your browser."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Aether — glowing smoke swirling on a dark background" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Linked, not imported from main.ts, so the loader below paints with the
         first frame instead of waiting for the module graph. -->
    <link rel="stylesheet" href="/src/styles.css" />
    <script>
      // The cross-origin-isolation reload's document continues the loader
      // rather than replaying its entrance (key: cross-origin-isolation.ts).
      try {
        if (sessionStorage.getItem('aether:coi-resume') === '1')
          document.documentElement.classList.add('boot-resumed');
      } catch {}
    </script>
  </head>
  <body>
    <!-- The simulation surface. Sized to the device pixel ratio by the renderer. -->
    <canvas id="stage" aria-label="Aether fluid simulation"></canvas>

    <!-- Populated by hud.ts. Empty here so the HUD owns its own markup. -->
    <div id="hud"></div>

    <!-- The intro console (landing.ts): boot progress, first-run welcome and
         fatal errors in one surface. The compact loader is prerendered here
         (mirrors `build` in landing.ts) so no document ever shows a blank
         screen while the modules load; the module takes it over seamlessly. -->
    <div id="boot" class="compact" role="dialog" aria-label="Welcome to Aether" aria-live="polite">
      <div class="landing-frame">
        <div class="landing-head">
          <div class="landing-title"><span class="landing-dot"></span><h1>AETHER</h1></div>
          <span class="landing-state">BOOTING</span>
        </div>
        <div class="landing-foot">
          <p class="landing-log">
            <span class="landing-prompt">&gt;</span><span id="boot-status">waking the engine…</span
            ><span class="landing-caret"></span>
          </p>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
